  n.style.width = '290px';
  n.appendChild(h4('图层（书写和擦除只作用于当前图层）'));
  layersInfo.layers.forEach(function (l) {
    var row = el('div', 'layer' + (l.id === layersInfo.active ? ' on' : ''));
    var name = el('button', 'name');
    name.textContent = (l.id === layersInfo.active ? '✓ ' : '') + l.name;
    tap(name, function () {
      if (l.id !== layersInfo.active) { send({ t: 'layer', op: 'activate', id: l.id }); return; }
      // tap the active one again: rename inline
      var input = el('input');
      input.value = l.name;
      name.innerHTML = '';
      name.appendChild(input);
      input.focus();
      input.select();
      var finish = function () {
        var v = input.value.trim();
        if (v && v !== l.name) send({ t: 'layer', op: 'rename', id: l.id, name: v });
        else refreshPop();
      };
      input.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') finish(); if (e.key === 'Escape') refreshPop(); });
      input.addEventListener('blur', finish);
    });
    var count = el('span', 'count');
    count.textContent = l.n + ' 笔';
    var eye = el('button', 'icon' + (l.hidden ? ' off' : ''), ICONS.eye);
    eye.title = l.hidden ? '显示' : '隐藏';
    tap(eye, function () { send({ t: 'layer', op: 'toggle', id: l.id }); });
    var del = el('button', 'icon', ICONS.trash);
    del.title = '删除图层（连同里面的笔迹，可撤销）';
    tap(del, function () {
      if (layersInfo.layers.length <= 1) { toast('至少要保留一个图层'); return; }
      if (del.dataset.armed) send({ t: 'layer', op: 'delete', id: l.id });
      else { del.dataset.armed = '1'; del.style.color = '#ff3b30'; toast('再点一次删除「' + l.name + '」'); }
    });
    row.appendChild(name);
    row.appendChild(count);
    row.appendChild(eye);
    row.appendChild(del);
    n.appendChild(row);
  });
  var add = el('button', 'mini ghost');
  add.style.marginTop = '10px';
  add.textContent = '＋ 新建图层';
  tap(add, function () { send({ t: 'layer', op: 'add' }); });
  n.appendChild(add);
  var tip = el('span', 'hint');
  tip.style.marginTop = '10px';
  tip.textContent = '点当前图层的名字可以重命名。';
  n.appendChild(tip);
  return n;
}

function buildSettingsPop() {
  var n = el('div');
  n.style.width = '300px';
  n.appendChild(h4('书写背景（只在书写时显示）'));
  n.appendChild(seg([['none', '无'], ['square', '方格'], ['dot', '点阵'], ['ruled', '横线']], prefs.grid, function (v) {
    prefs.grid = v; savePrefs(); drawGrid(); renderBar(); refreshPop();
  }));
  n.appendChild(h4('格子大小'));
  n.appendChild(seg([[0, '小'], [1, '中'], [2, '大']], prefs.gridSize, function (v) { prefs.gridSize = v; savePrefs(); drawGrid(); refreshPop(); }));
  n.appendChild(h4('书写辅助'));
  n.appendChild(prefToggle('根号 √ 自动整齐', '写完自动变成规整的根号', 'autoRadical'));
  n.appendChild(prefToggle('吸附到图形节点', '端点、角点自动对齐', 'snapNodes'));
  n.appendChild(prefToggle('图形吸附到格点', '打开书写背景时生效', 'gridSnap'));
  n.appendChild(prefToggle('涂抹擦除', '用笔在笔迹上来回涂抹，连同涂抹线一起擦掉（像 GoodNotes）', 'scribbleErase'));
  n.appendChild(h4('脑图'));
  n.appendChild(prefToggle('笔迹绑定到选中的卡片', '有选中卡片时，新笔迹跟着它走（否则跟最近的卡片）', 'bindSelected'));
  n.appendChild(prefToggle('双击卡片进入聚焦', '卡片上的单点会稍等约 0.3 秒再落笔', 'doubleTapFocus'));
  n.appendChild(prefToggle('手势', '双指轻点撤销，三指轻点重做', 'gestures'));
  n.appendChild(h4('与 MarginNote 融合'));
  n.appendChild(prefToggle('接管 MN 自带的书写按钮', 'MN 的笔按钮变成 MN Ink 的开关，不再进入 MN 自带的书写模式', 'takeover'));
  var mnb = el('button', 'mini');
  mnb.textContent = '暂时用 MN 自带笔（改以前的手写）';
  mnb.style.marginTop = '8px';
  tap(mnb, function () { closePopover(); send({ t: 'mnPen' }); });
  n.appendChild(mnb);
  return n;
}

function normHex(v) {
  v = String(v || '').trim().replace(/^#/, '');
  if (/^[0-9a-f]{3}$/i.test(v)) v = v.split('').map(function (c) { return c + c; }).join('');
  return /^[0-9a-f]{6}$/i.test(v) ? '#' + v.toLowerCase() : null;
}

function openPalette(listKey, i, anchor) {
  var n = el('div');
  n.style.width = '264px';
  var target = activeSlot() || penSlot();
  function pick(c) {
    prefs[listKey][i] = c;
    target.color = c;
    rememberColor(c);
    savePrefs();
    renderBar();
  }
  function swatches(list, title) {
    if (!list.length) return;
    n.appendChild(h4(title));
    var grid = el('div', 'palette');
    list.forEach(function (c) {
      var b = el('button', 'sw' + (prefs[listKey][i].toLowerCase() === c ? ' on' : ''));
      b.style.background = c;
      b.title = c.toUpperCase();
      tap(b, function () { pick(c); closePopover(); });
      grid.appendChild(b);
    });
    n.appendChild(grid);
  }
  swatches(prefs.recentColors, '最近使用');
  swatches(PALETTE, '颜色');
  n.appendChild(h4('16 进制 / 取色'));
  var row = el('div', 'hexrow');
  var preview = el('span', 'preview');
  preview.style.background = prefs[listKey][i];
  var hex = el('input');
  hex.type = 'text';
  hex.maxLength = 7;
  hex.value = prefs[listKey][i].toUpperCase();
  hex.spellcheck = false;
  hex.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  hex.addEventListener('input', function () {
    var c = normHex(hex.value);
    if (c) preview.style.background = c;
  });
  var apply = el('button', 'mini');
  apply.textContent = '使用';
  var doApply = function () {
    var c = normHex(hex.value);
    if (!c) { toast('请输入 6 位 16 进制颜色，例如 #1F4FD1'); return; }
    pick(c);
    closePopover();
  };
  hex.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') doApply(); });
  tap(apply, doApply);
  var wheel = el('input');
  wheel.type = 'color';
  wheel.value = prefs[listKey][i];
  wheel.addEventListener('input', function () { hex.value = wheel.value.toUpperCase(); preview.style.background = wheel.value; });
  wheel.addEventListener('change', function () { pick(wheel.value.toLowerCase()); });
  var drop = el('button', 'drop', ICONS.drop);
  drop.title = '吸管';
  tap(drop, startEyedrop);
  row.appendChild(preview);
  row.appendChild(hex);
  row.appendChild(wheel);
  row.appendChild(drop);
  row.appendChild(apply);
  n.appendChild(row);
  openPop('palette', anchor, n);
}

// ===========================================================================
// Selection bar / paste / toast
// ===========================================================================
var selbar = document.getElementById('selbar');
tap(document.getElementById('selCopy'), function () { send({ t: 'copy' }); });
tap(document.getElementById('selCut'), function () { send({ t: 'cut' }); });
tap(document.getElementById('selDup'), function () { send({ t: 'duplicate' }); });
tap(document.getElementById('selCard'), function () { send({ t: 'cardDrawing' }); });
tap(document.getElementById('selBind'), function () {
  if (surface !== 'map') { toast('只有脑图上的笔迹能绑定到卡片'); return; }
  mode = 'bind';
  cv.className = 'c-copy';
  toast('点一下要绑定的卡片');
});
tap(document.getElementById('selDelete'), function () { send({ t: 'deleteSel' }); });
tap(document.getElementById('selCancel'), function () { clearSelection(true); });

function showSelBar() {
  if (!sel || sel.drag) {
    selbar.style.display = 'none';
    return;
  }
  var b = sel.box;
  selbar.style.display = 'flex';
  var w = selbar.offsetWidth || 440;
  var x = Math.max(8, Math.min(W - w - 8, b.x));
  var y = b.y - 92;
  if (y < 8) y = b.y + b.h + 22;
  selbar.style.left = x + 'px';
  selbar.style.top = y + 'px';
}

var pastebar = document.getElementById('pastebar');
var pasteAt = null;
tap(document.getElementById('pasteBtn'), function () {
  if (pasteAt) send({ t: 'paste', x: pasteAt[0], y: pasteAt[1] });
  hidePaste();
});

function showPaste(x, y) {
  pasteAt = [x, y];
  pastebar.style.display = 'flex';
  pastebar.style.left = Math.max(8, x - 28) + 'px';
  pastebar.style.top = Math.max(8, y - 50) + 'px';
}

function hidePaste() {
  pastebar.style.display = 'none';
  pasteAt = null;
}

var toastTimer = 0;
function toast(text) {
  var t = document.getElementById('toast');
  t.textContent = text;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, 1800);
}

// ===========================================================================
// API for the add-on
// ===========================================================================
function flatToPts(flat) {
  var out = [];
  for (var i = 0; i + 1 < flat.length; i += 2) out.push([flat[i], flat[i + 1]]);
  return out;
}

window.ink = {
  ack: function (n) {
    if (inflight && inflight.seq === n) {
      inflight = null;
      applyServerView();
      pump();
    }
  },
  init: function (o) {
    merge(o.prefs);
    if (o.view) {
      view.minZ = o.view.minZ || view.minZ;
      view.maxZ = o.view.maxZ || view.maxZ;
      serverView = o.view;
      applyServerView();
    }
    hist = o.state || hist;
    nodesCanvas = o.nodes || [];
    cardsCanvas = o.cards || null;
    surface = o.surface || 'map';
    surfaces = o.surfaces || surfaces;
    hasClip = !!o.clip;
    if (o.layers) layersInfo = o.layers;
    ruler = defaultRuler();
    cv.className = cursorClass(prefs.tool);
    renderBar();
    drawGrid();
    schedule();
    if (o.storage === 'file') toast('提示：没找到可复用的隐藏笔记，笔迹暂存在本机文件里');
  },
  setView: function (v) {
    serverView = v;
    applyServerView();
  },
  nodes: function (n) {
    nodesCanvas = n || [];
  },
  cards: function (c) {
    cardsCanvas = c || null;
  },
  layers: function (l) {
    if (!l) return;
    layersInfo = l;
    renderBar();
    if (popover && popover.key === 'layers') refreshPop();
  },
  clip: function (n) {
    hasClip = n > 0;
    if (n) toast('已拷贝 ' + n + ' 笔，轻点空白处可粘贴');
  },
  picked: function (p) {
    if (!p) { toast('这里没有笔迹'); return; }
    var target = activeSlot() || penSlot();
    target.color = p.color;
    rememberColor(p.color);
    savePrefs();
    renderBar();
    toast('已取色 ' + p.color.toUpperCase());
  },
  cardDrawing: function (list) {
    var png = renderCardImage(list);
    if (!png) { toast('没有选中笔迹'); return; }
    send({ t: 'createCard', png: png });
  },
  committed: function (o) {
    if (o.state) ink.state(o.state);
    if (o.erased) {
      // Scribble to erase: the scribble fades out with the ink it took.
      var sc = pending.get(o.lid);
      pending.delete(o.lid);
      if (sc) { vanishing.push({ s: sc, t: performance.now(), hold: 0, fade: 280 }); kickAnim(); }
      toast('已擦除 ' + o.erased + ' 笔');
      schedule();
      return;
    }
    // Keep the live copy one more frame so the native one is on screen first.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        pending.delete(o.lid);
        schedule();
      });
    });
  },
  state: function (s) {
    var changed = s.canUndo !== hist.canUndo || s.canRedo !== hist.canRedo;
    hist = s;
    if (changed) renderBar();
  },
  selection: function (s) {
    if (s) {
      sel = { box: { x: s.x, y: s.y, w: s.w, h: s.h }, n: s.n, drag: null, editPts: null, shape: null };
      if (s.shape) {
        sel.shape = {
          id: s.shape.id, closed: s.shape.closed, nodes: flatToPts(s.shape.pts), color: s.shape.color,
          width: s.shape.width, alpha: s.shape.alpha, dash: s.shape.dash
        };
      }
    } else {
      sel = null;
    }
    renderBar();
    showSelBar();
    schedule();
  },
  lassoResult: function (s) {
    if (!s) toast('当前图层这里没有笔迹');
    ink.selection(s);
  },
  toast: function (text) {
    toast(text);
  },
  error: function (msg) {
    toast('MN Ink: ' + msg);
  }
};

resize();
renderBar();
send({ t: 'ready' });
</script>
